# surrogate/config.yaml - Phase 3 evaluation protocol and go/no-go gate, FROZEN BEFORE ANY TUNING.
# Source: claude/Phase3_Execution_Plan.md Rev 2 (M1, M2, M6, M7, M10 and gate §6),
# signed off by Ishan on 30 Oct 2026. Do not edit after Sub-task 3.1 without a dated note here
# and in the plan; test_cv.py checks these values against the Phase 2.8 library.

signed_off: "2026-10-30"
frozen_in_code: "2026-11-02"

dataset_sha256:                      # frozen Phase 2 dataset (2.7 manifest)
  training: b826d61b541fc59d40df9ba21a75dde37d37c0a025a3f09cc3f277c21df5216e
  holdout: d14bc0b03d1e2e804f09b32b6d10e4c73a2f794cfde416dbf3ed8fcd6d501ea4

protocol:                            # M1
  seed: 42
  grouped_cv: {n_folds: 5, shuffle: true, group: design_id}   # development: all selection and tuning
  loco: {group: climate_key}                                   # diagnostic only, never used for tuning
  holdout: {in_distribution: 300, london: 100, scored_once_in: "3.7"}

targets:
  primary: [heating_demand_kwh_m2, cooling_demand_kwh_m2, eui_kwh_m2]
  secondary: [peak_heating_w_m2, peak_cooling_w_m2, zone_cooling_core_kwh_m2, zone_cooling_south_kwh_m2,
              zone_cooling_east_kwh_m2, zone_cooling_north_kwh_m2, zone_cooling_west_kwh_m2]
  heating: [heating_demand_kwh_m2, peak_heating_w_m2]   # scored over the heating climates only
  heating_climate_min_median: 1.0                       # kWh/m2, as 2.8 (E4)

metrics:                             # M2 definitions
  top_fraction: 0.10                 # top-10 % hit rate: share of the truly best 10 % (lowest) designs
  mape_min_y: 1.0                    # MAPE uses rows with |y| >= this (avoids dividing by near-zero heating)

target_forms:                        # M6 constants, fixed from archetype physics (not tuned)
  hdd_base_c: 15
  hdd_offset: 50
  eui_constant_kwh_m2: 48.87         # plug + lighting electricity of the archetype
  index_setpoints: {heating_c: 21, cooling_c: 24, room_rh: 0.50}

selection:                           # M10, pre-registered
  primary_skill_min: 0.90
  secondary_skill_min: 0.85
  primary_rule: lowest_loco_mape
  secondary_rule: highest_grouped_skill
  tie_mape_points: 0.5
  tie_skill: 0.005
  tie_break: lightgbm

m7_trigger:                          # propose Sub-task 2.9 if exceeded after 3.4
  loco_median_abs_bias_pct: 10.0
  targets: [heating_demand_kwh_m2, eui_kwh_m2]

reference_2_8:                       # S0: untuned RF on the 28 raw inputs (outputs/eda/eda_metrics.json)
  rf_params: {n_estimators: 300, min_samples_leaf: 2, max_features: 0.3333333333333333, n_jobs: -1, random_state: 42}
  design_skill:
    heating_demand_kwh_m2: 0.704321
    cooling_demand_kwh_m2: 0.748890
    eui_kwh_m2: 0.679843
    peak_heating_w_m2: 0.764403
    peak_cooling_w_m2: 0.744728
    zone_cooling_core_kwh_m2: 0.868029
    zone_cooling_south_kwh_m2: 0.830055
    zone_cooling_east_kwh_m2: 0.852220
    zone_cooling_north_kwh_m2: 0.825538
    zone_cooling_west_kwh_m2: 0.766184
  tolerance: 0.002

gate:                                # §6: NO-GO on any FAIL, REVIEW on any WARN, else GO
  S0: {check: "RF raw reproduces 2.8", tolerance: 0.002, severity: FAIL}
  S1: {check: "primary, grouped CV", design_skill_min: 0.90, pooled_r2_min: 0.95, severity: FAIL}
  S2: {check: "secondary, grouped CV", design_skill_min: 0.85, severity: WARN}
  S3: {check: "in-distribution holdout vs CV", design_skill_min: 0.88, pooled_r2_max_drop: 0.03, severity: FAIL}
  S4: {check: "London", cooling_eui_mape_max_pct: 10, heating_mape_max_pct: 25, spearman_min: 0.90, severity: WARN}
  S5: {check: "OAT sign agreement", strong_params_all_correct: true, share_sign_correct_min: 0.90,
       min_abs_delta_pct: 2, severity: FAIL}
  S6: {check: "monotonic sweeps", max_share_reversals: 0.01, severity: WARN}
  S7: {check: "conformal 90 % coverage, holdout", coverage_min: 0.85, coverage_max: 0.95, severity: WARN}
  S8: {check: "speed on the Mac", single_design_ms_max: 50, batch_designs_per_s_min: 10000, severity: FAIL}

# ── Added 3 Nov 2026 (Sub-task 3.2, claude/Phase3.2_Execution_Plan.md D2-D4), BEFORE any 3.2 run. ──
# Nothing above this line was changed. Untuned ("default") settings for the feature ablation:
# RF = the 2.8/S0 forest (reference_2_8.rf_params); LightGBM = the library defaults of 4.7.0,
# written out so they cannot drift with a library update, plus a seed and determinism flags.
ablation_3_2:
  feature_sets: [R, G, S, U, C, C-G, C-S, C-U]        # D2: ladder + leave-one-group-out
  models: [rf, lgbm]
  targets: primary                                     # 3 primary targets, direct form
  protocols: [grouped, loco]                           # LOCO reported only, never used to select (D3)
  lgbm_params: {n_estimators: 100, learning_rate: 0.1, num_leaves: 31, max_depth: -1, min_child_samples: 20,
                subsample: 1.0, colsample_bytree: 1.0, reg_alpha: 0.0, reg_lambda: 0.0,
                random_state: 42, n_jobs: -1, deterministic: true, force_col_wise: true, verbose: -1}
  selection:                                           # D3 + D4
    score: mean_grouped_design_skill_over_primary_targets_and_models
    tie_skill: 0.005
    tie_break: fewest_features

# ── Added 5 Nov 2026 (Sub-task 3.3, claude/Phase3.3_Execution_Plan.md Rev 1.1, E1-E6 agreed 5 Nov),
# BEFORE any 3.3 run. Nothing above this line was changed. Model benchmark and tuning (M4, M5, M10).
benchmark_3_3:
  feature_set: C-G                                     # 3.2 winner (63 features)
  reference_set: R                                     # untuned reference rows (E2)
  models: [rf, xgb, lgbm, gpr, mlp]
  targets: primary                                     # direct form only (E1); secondary in run D
  defaults:                                            # untuned settings (E2); written out, cannot drift
    rf: reference_2_8                                  # = reference_2_8.rf_params (the 2.8/S0 forest)
    lgbm: ablation_3_2                                 # = ablation_3_2.lgbm_params (LightGBM 4.7.0 defaults)
    xgb: {n_estimators: 100, learning_rate: 0.3, max_depth: 6, min_child_weight: 1.0, subsample: 1.0,
          colsample_bytree: 1.0, reg_lambda: 1.0, reg_alpha: 0.0, tree_method: hist, max_bin: 256,
          random_state: 42, n_jobs: -1}                # XGBoost 3.4.1 library defaults
    gpr: {nu: 2.5, length_scale_init: 1.0, length_scale_bounds: [0.01, 1000.0], constant_init: 1.0,
          constant_bounds: [0.001, 1000.0], noise_init: 0.01, noise_bounds: [1.0e-6, 10.0],
          normalize_y: true, n_restarts_optimizer: 0, random_state: 42, top_k: null}   # E5
    mlp: {n_layers: 3, width: 128, dropout: 0.0, lr: 1.0e-3, weight_decay: 1.0e-4, batch_size: 128}
  mlp_fixed: {activation: silu, optimizer: adamw, max_epochs: 1000, patience: 50, val_fraction: 0.10,
              device: cpu, seed: 42, targets: all}      # E6: one multi-output net over all 10 targets
  fixed:                                               # always set, tuned or not
    rf: {n_jobs: -1, random_state: 42}
    lgbm: {random_state: 42, n_jobs: -1, deterministic: true, force_col_wise: true, verbose: -1, subsample_freq: 1}
    xgb: {tree_method: hist, random_state: 42, n_jobs: -1}
  tuning:                                              # M5
    sampler: tpe
    seed: 42
    n_startup_trials: 10
    pruning: false                                     # every trial is a full 5-fold CV (equal budgets)
    trials: {rf: 60, xgb: 60, lgbm: 60, mlp: 30, gpr: 0}   # gpr: marginal likelihood instead (E5)
    objective: grouped_cv_rmse_on_scored_rows           # heating climates for heating targets
    mlp_objective: mean_primary_rmse_over_sd            # E6: mean of RMSE / SD(y) over the 3 primary targets
  search_spaces:                                       # int/float: [low, high], log; categorical: choices
    rf:
      n_estimators: {type: fixed, value: 500}
      max_features: {type: float, low: 0.1, high: 1.0}
      min_samples_leaf: {type: int, low: 1, high: 10}
      max_depth: {type: categorical, choices: [null, 10, 15, 20, 30, 40]}
      max_samples: {type: float, low: 0.5, high: 1.0}
    lgbm:
      n_estimators: {type: int, low: 100, high: 2000, log: true}
      learning_rate: {type: float, low: 0.01, high: 0.2, log: true}
      num_leaves: {type: int, low: 8, high: 128, log: true}
      min_child_samples: {type: int, low: 5, high: 60}
      subsample: {type: float, low: 0.5, high: 1.0}
      colsample_bytree: {type: float, low: 0.3, high: 1.0}
      reg_alpha: {type: float, low: 1.0e-8, high: 10.0, log: true}
      reg_lambda: {type: float, low: 1.0e-8, high: 10.0, log: true}
    xgb:
      n_estimators: {type: int, low: 100, high: 2000, log: true}
      learning_rate: {type: float, low: 0.01, high: 0.2, log: true}
      max_depth: {type: int, low: 3, high: 10}
      min_child_weight: {type: float, low: 1.0, high: 20.0, log: true}
      subsample: {type: float, low: 0.5, high: 1.0}
      colsample_bytree: {type: float, low: 0.3, high: 1.0}
      reg_alpha: {type: float, low: 1.0e-8, high: 10.0, log: true}
      reg_lambda: {type: float, low: 1.0e-8, high: 10.0, log: true}
    mlp:
      n_layers: {type: int, low: 2, high: 4}
      width: {type: categorical, choices: [64, 128, 256, 512]}
      dropout: {type: float, low: 0.0, high: 0.3}
      lr: {type: float, low: 1.0e-4, high: 3.0e-3, log: true}
      weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
      batch_size: {type: categorical, choices: [64, 128, 256]}
  fresh_fold_seed: 7                                   # E4: tuned params re-scored once on GroupKFold(5, seed 7)
  gpr_fallback: {max_fit_minutes: 10, top_k: 15, ranker: lgbm_gain_in_training_fold}   # E5
  d5:                                                  # E3, applied after the untuned grid, before tuning
    models: [xgb, gpr, mlp]
    score: mean_untuned_grouped_design_skill_over_primary_targets
    rule: feature_set_must_score_higher_than_reference_set
  secondary:
    models: [lgbm, best_other]
    best_other_rule: highest_mean_tuned_primary_design_skill_excluding_lgbm
  selection_status: {primary: provisional_until_3_4, secondary: final}   # E1; rule = selection (M10)

# ── Added 7 Nov 2026 (after Sub-task 3.3 was complete), BEFORE any run that uses it. Nothing above
# this line was changed. Sensitivity analysis requested by Ishan: the 3.3 grid measured feature gains
# before tuning and tuning gains after features, so the two are confounded by order and by the skill
# ceiling. Adding the missing cell (tuned on R) completes a 2 x 2 factorial {R, C-G} x {untuned, tuned}.
# Same budgets, search spaces, sampler, objective and folds as benchmark_3_3. Reported only:
# it does NOT change the 3.3 selection or any gate.
sensitivity_3_3:
  name: factorial_features_x_tuning
  feature_set: R
  models: [rf, xgb, lgbm, mlp]                         # GPR has no Optuna tuning (E5): its R cell = untuned
  targets: primary
  protocol: grouped                                    # seed-42 folds, as the RQ1 grid
  budgets: benchmark_3_3.tuning.trials                 # 60 per target (rf, xgb, lgbm), 30 (mlp, one study)
  relative_measure: share_of_remaining_error_removed   # (skill_after - skill_before) / (1 - skill_before)
  selection_effect: none

# ── Added 8 Nov 2026 (Sub-task 3.4, claude/Phase3.4_Execution_Plan.md Rev 1.3, F1-F6 agreed 7 Nov),
# BEFORE any 3.4 run. Nothing above this line was changed. Climate generalisation (M6, M7, M10).
# Constants of the target forms (HDD base 15 C, offset 50, 48.87 kWh/m2, setpoints 21/24 C, 50 % RH)
# are the `target_forms` block above (frozen 30 Oct), used unchanged.
climate_gen_3_4:
  feature_set: C-G+I                                   # F1: C-G (63) + the 7 indices = 70 columns
  base_feature_set: C-G
  indices: [occ_enth_excess, occ_latent_excess, occ_band_dh, occ_cool_dh, occ_heat_dh, hdd15, hdd12]
  index_definition:                                    # surrogate/climate_indices.py (step 1)
    occupied_hours_ending: {mon_fri: [7, 22], sat: [7, 18], sun: none}   # year starts Sunday 1 Jan
    room_reference: {temperature_c: 24, rh: 0.50, pressure: hourly_epw_station}
    psychrometrics: ashrae_fundamentals_2017_ch1   # Hyland-Wexler saturation pressure; W from dew point
    band: clip(24 - T, 0, 3)
    degree_days: daily_mean_of_24_hourly_values      # as Phase 2.3
    holdout_indices: final_test_only                 # London computed only in final_test.py (3.7)
  models: [rf, xgb, lgbm, gpr, mlp]                    # F2: every family gets every form
  forms:                                               # F2 / M6
    heating_demand_kwh_m2: [direct, log1p, ratio]      # ratio = y / (HDD15 + 50)
    cooling_demand_kwh_m2: [direct]
    eui_kwh_m2: [direct, decomposed]
    peak_heating_w_m2: {forms: [direct, ratio], models: [lgbm, mlp]}   # secondary
  decomposed_eui:                                      # F3
    identity: eui = 48.87 + heating + cooling + oa_level + oa_dev
    heating_form: ratio
    oa_level: {model: ols_with_intercept, x: [occ_enth_excess, occ_band_dh, occ_heat_dh],
               y: per_climate_mean_oa_term, fitted_on: training_climates_of_each_fold}
    oa_dev: {target: oa_term_minus_training_climate_mean, model: same_family_as_candidate,
             params: family_tuned_eui_settings}
  hyperparameters:                                     # F2: no re-tuning (E1)
    source: surrogate/outputs/tuning/best_params.json  # 3.3 studies, tuned on C-G
    rule: same_family_and_original_target              # heating forms -> heating settings, etc.
    gpr: {params: benchmark_3_3.defaults.gpr, top_k: 15}   # E5 fallback, as 3.3
    mlp: mlp__all                                      # the one 3.3 MLP study
    tuned_on_feature_set: C-G                          # reused on C-G+I: documented simplification
  mlp_outputs:                                         # F4: one network, 14 outputs
    direct: all_10_targets
    extra: [heating_ratio, heating_log1p, peak_heating_ratio, oa_dev]
  protocols:
    grouped: {folds: benchmark grouped folds, seed: 42}  # selection skill (M10 step 1)
    loco: {folds: 10, group: climate_key}               # M10 step 2 + M7; reported per held-out climate
  baseline_pool: 3.3 tuned C-G direct candidates (outputs/benchmark/tuned_table.csv)   # stay candidates
  skew_check:                                          # F2: log1p "where skew > 1" (M6)
    threshold: 1.0
    statistic: pandas_skew_on_scored_rows              # heating climates for heating targets
    model: lgbm
    targets: secondary_only                            # heating already has log1p in the grid
    enters_selection: false                            # reported only; secondary picks stay final (F6)
  fix4:                                                # F5, conditional
    trigger: selected_primary_candidate_loco_median_abs_bias_pct_gt
    trigger_value: 5.0
    drop_climate_inputs: [mean_dbt, latitude, mean_wind]   # none is used by a C-group feature
    keep: [hdd18, cdd10, annual_ghi, mean_rh, 7_indices]
    applies_to: the_triggering_selected_candidate_only
    enters_selection: true
  selection:                                           # F6: M10 (`selection` block) unchanged
    pool: baseline_pool + grid + fix4
    candidate_key: [model, feature_set, form]
    primary: lowest_loco_mape_among_grouped_skill_ge_0.90
    tie_break: lightgbm_candidate_with_best_value_within_margin
    secondary_rechecked: [peak_heating_w_m2]           # highest grouped skill (secondary rule)
    secondary_unchanged: final_3_3_picks               # all MLP direct
    record_one_family: true                            # master plan §1 preference (Phase 5)
  m7: m7_trigger                                       # block above, applied to the selected candidates
  reporting:
    climate_distance: {features: phase2_7_climate_inputs, scaling: zscore_over_10_training_climates,
                       measure: euclidean_to_nearest_other_training_climate}
    ranking_metrics: [spearman_median, bias_removed_r2, top_hit_mean]   # M2, as 3.3
    gpr_selected_features_per_fold: true               # open item 5 (handoff §8)
    save_oof: {grouped: true, loco: true}              # grouped OOF feeds 3.5
